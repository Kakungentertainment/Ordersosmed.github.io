<script>
// Saat halaman dimuat: cek status
window.addEventListener('load', function() {
    if (localStorage.getItem('sudah_klik_daftar') === 'ya') {
        tampilkanTeksPengganti();
    }
});

// Fungsi: tandai, lalu jeda 1,5 detik sebelum berubah
function tandaiDanTunda() {
    localStorage.setItem('sudah_klik_daftar', 'ya');
    // Beri jeda 1,5 detik setelah diklik
    setTimeout(function() {
        tampilkanTeksPengganti();
    }, 1500);
}

function tampilkanTeksPengganti() {
    const tombol = document.getElementById('tombolDaftar');
    const teksBaru = document.getElementById('teksSetelahDaftar');
    const teksIngat = document.getElementById('teksIngat');
    
    if (tombol) tombol.style.display = 'none';
    if (teksBaru) teksBaru.style.display = 'block';
    // Ubah tulisan Ingat Saya
    if (teksIngat) teksIngat.innerHTML = "Anda akan diarahkan ke halaman selanjutnya untuk konfirmasi Username dan Password";
}

function prosesMasuk() {
    const sudahKlikDaftar = localStorage.getItem('sudah_klik_daftar');
    const sudahTampil = localStorage.getItem('pesanTampil');
    const kotakPesan = document.getElementById('infoAlert');

    // Jika tombol sudah diklik atau pesan sudah pernah muncul -> langsung pindah halaman
    if (sudahKlikDaftar === 'ya' || sudahTampil === 'ya') {
        return true;
    }

    // Klik pertama kali: tampilkan pesan saja
    kotakPesan.style.display = 'block';
    kotakPesan.style.opacity = '1';
    localStorage.setItem('pesanTampil', 'ya');

    // Hilangkan pesan setelah 5 detik
    setTimeout(() => {
        kotakPesan.style.opacity = '0';
        setTimeout(() => {
            kotakPesan.style.display = 'none';
        }, 500);
    }, 5000);

    // Tidak pindah halaman dulu
    return false;
}
</script>
